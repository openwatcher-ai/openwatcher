name: Admin Manual Score

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - review_submitted

permissions:
  contents: read
  pull-requests: read

jobs:
  admin-manual-score:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require repository admin approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          reviews_json="$RUNNER_TEMP/pr-reviews.json"
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate > "$reviews_json"

          mapfile -t approved_logins < <(
            jq -r '
              group_by(.user.login)
              | map(.[-1])
              | map(select(.state == "APPROVED"))
              | .[].user.login
            ' "$reviews_json"
          )

          if [[ "${#approved_logins[@]}" -eq 0 ]]; then
            echo "缺少有效 PR approval。"
            exit 1
          fi

          for login in "${approved_logins[@]}"; do
            permission="$(
              gh api "repos/${REPOSITORY}/collaborators/${login}/permission" --jq '.permission'
            )"
            if [[ "$permission" == "admin" ]]; then
              echo "管理员 ${login} 已批准该 PR。"
              exit 0
            fi
          done

          echo "已有 approval，但没有来自仓库管理员。"
          exit 1
